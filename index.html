<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Calypso</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="/src/main.ts" defer></script>
    <meta name="description" content="Play Calypso Online is a place to play
        the trick-taking card game Calypso against bot players
        in-browser.">
</head>

<body>
    <div id="new-game-button">New game</div>
    <div id="new-game-menu" hidden>
        <form id="new-game-form">
            <fieldset>
                <legend>Trickplay</legend>
                <input type="radio" name="trickplay" value="standard" id="trickplay-standard">
                <label for="trickplay-standard">Standard</label>
                <input type="radio" name="trickplay" value="allfours" id="trickplay-allfours">
                <label for="trickplay-allfours">All Fours</label>
            </fieldset>

            <fieldset>
                <legend>Game format</legend>
                <input type="radio" name="gamemode" value="classic" id="gamemode-classic">
                <label for="gamemode-classic">Classic</label>
                <input type="radio" name="gamemode" value="embers" id="gamemode-embers">
                <label for="gamemode-embers">Embers</label>
            </fieldset>

            <fieldset data-gamemode-options="embers" hidden>
                <legend>Number of hands</legend>
                <input type="radio" name="numhands" value="4" id="numhands-4">
                <label for="numhands-4">4</label>
                <input type="radio" name="numhands" value="8" id="numhands-8">
                <label for="numhands-8">8</label>
                <input type="radio" name="numhands" value="12" id="numhands-12">
                <label for="numhands-12">12</label>
                <input type="radio" name="numhands" value="16" id="numhands-16">
                <label for="numhands-16">16</label>
            </fieldset>

            <fieldset data-gamemode-options="embers" hidden>
                <legend>Number of packs</legend>
                <input type="radio" name="packs" value="2" id="packs-2">
                <label for="packs-2">2</label>
                <input type="radio" name="packs" value="3" id="packs-3">
                <label for="packs-3">3</label>
                <input type="radio" name="packs" value="4" id="packs-4">
                <label for="packs-4">4</label>
            </fieldset>

            <fieldset data-gamemode-options="embers" hidden>
                <legend>Sitouts</legend>
                <div class="option-row" data-packs-options="2,3,4" hidden>
                    <input type="radio" name="sitouts" value="0" id="sitouts-0">
                    <label for="sitouts-0">0</label>
                </div>
                <div class="option-row" data-packs-options="3,4" hidden>
                    <input type="radio" name="sitouts" value="1" id="sitouts-1">
                    <label for="sitouts-1">1</label>
                </div>
                <div class="option-row" data-packs-options="4" hidden>
                    <input type="radio" name="sitouts" value="2" id="sitouts-2">
                    <label for="sitouts-2">2</label>
                </div>
            </fieldset>

            <button type="submit" id="play-now">Play Now</button>
        </form>
    </div>

    <div class="info">
        <div class="config" id="config"></div>
        <div class="hand-number" id="hand-number"></div>
    </div>

    <div class="scores-container">
        <div class="scores" id="scores">
            <table class="scores-table" id="scores-table"></table>
        </div>
    </div>

    <div id="game-board" class="game-board">
    </div>

    <div id="previous-trick" class="previous-trick">
        <div id="prev-area" class="prev-area">
        </div>
    </div>

    <div class="hand">
        <div id="player-hand"></div>
    </div>

</body>

</html>
